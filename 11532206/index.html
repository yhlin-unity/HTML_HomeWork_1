
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>LimbusCompany-浮士德人格</title>

    <style>
        /* 網頁基本設定 */
        body {
            margin: 0;
            background-color: #eeeeee;
        }

        /* 整張相簿背景 */
        .album {
            width: 1024px;
            height: 1516px;
            margin: 0 auto;
            background-image: url("images/index.jpg");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            position: relative;
        }

        /* 六張照片排列位置 */
        .photo-grid {
            position: absolute;
            top: 365px;
            left: 265px;

            display: grid;
            grid-template-columns: 300px 300px;
            column-gap: 35px;
            row-gap: 60px;
        }

        /* 每張照片的黃色背景 */
        .photo {
            width: 350px;
            height: 280px;
            background-image: url("images/photobg.png");
            background-repeat: no-repeat;
            background-size: 100% 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }

        /* 六張小照片 */
        .photo img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }

        /* 照片下方文字 */
.photo p {
    margin: 5px 0 0;
    font-family: "SimSun", "PMingLiU", serif;
    font-size: 16px;
    font-weight: bold;
    color: #5e5145;
}
        .photo:nth-child(2),
.photo:nth-child(4),
.photo:nth-child(6) {
    transform: translateX(-50px);
}
    </style>
</head>

<body>
